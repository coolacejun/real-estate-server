services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    command:
      - --api.dashboard=true
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    restart: unless-stopped
    env_file: .env

  api:
    build: ./api
    container_name: api
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - DATA_DIR=/data/uploads
      - TILE_CACHE_DIR=/data/uploads/tile_cache
      - CADASTRAL_TILE_VERSION=v1
      - CADASTRAL_TILE_RENDER_REV=r13
      - CADASTRAL_TILE_SIZE=512
      - CADASTRAL_TILE_SUPERSAMPLE=4
      - CADASTRAL_TILE_STROKE_WIDTH=0.6
      - CADASTRAL_TILE_STROKE_ALPHA=160
      - CADASTRAL_TILE_LABEL_ENABLED=true
      - CADASTRAL_TILE_LABEL_MIN_ZOOM=17
      - CADASTRAL_TILE_LABEL_MIN_BOX=6
      - CADASTRAL_TILE_LABEL_MIN_FONT_PX=9
      - CADASTRAL_TILE_LABEL_MAX_FONT_PX=30
      - CADASTRAL_TILE_LABEL_STROKE_WIDTH=1.2
      - CADASTRAL_TILE_LABEL_MIN_ZOOM_SCALE=0.45
      - CADASTRAL_TILE_LABEL_MAX_ZOOM_SCALE=1.0
      - CADASTRAL_TILE_DOWNSAMPLE_FILTER=bicubic
      - CADASTRAL_TILE_PREFILTER_BLUR_RADIUS=0.35
      - CADASTRAL_TILE_UNSHARP_RADIUS=0
      - CADASTRAL_TILE_UNSHARP_PERCENT=0
      - CADASTRAL_TILE_UNSHARP_THRESHOLD=0
      - CADASTRAL_TILE_LABEL_FONT_PATH=/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
      - CADASTRAL_TILE_MIN_ZOOM=17
      - CADASTRAL_TILE_MAX_ZOOM=21
      - CADASTRAL_TILE_MEMORY_CACHE_SIZE=512
      - CADASTRAL_TILE_DB_LIMIT=6000
      - CADASTRAL_TILE_TABLE=cadastral_features
      - CADASTRAL_TILE_RELEASE_COL=release_id
      - CADASTRAL_TILE_GEOJSON_COL=geojson
      - CADASTRAL_TILE_LABEL_COL=label
      - CADASTRAL_TILE_PNU_COL=pnu
      - CADASTRAL_TILE_LABEL_LON_COL=label_lon
      - CADASTRAL_TILE_LABEL_LAT_COL=label_lat
      - CADASTRAL_IMPORT_LABEL_PRECISION=0.00002
      - CADASTRAL_TILE_MIN_LON_COL=bbox_min_lon
      - CADASTRAL_TILE_MAX_LON_COL=bbox_max_lon
      - CADASTRAL_TILE_MIN_LAT_COL=bbox_min_lat
      - CADASTRAL_TILE_MAX_LAT_COL=bbox_max_lat
      - BUILDING_INFO_IMPORT_WORKERS=1
      - IMPORT_BATCH_SIZE_BUILDING_INFO_FULL=12000
      - IMPORT_BATCH_SIZE_BUILDING_INFO_UPDATE=4000
      - BUILDING_HUB_SYNC_DIR=/data/source/building_info_hub
      - BUILDING_HUB_SYNC_UPLOAD_DAY=${BUILDING_HUB_SYNC_UPLOAD_DAY:-20}
      - BUILDING_HUB_SYNC_UPLOAD_CHECK_HOUR=${BUILDING_HUB_SYNC_UPLOAD_CHECK_HOUR:-13}
      - BUILDING_HUB_SYNC_UPLOAD_WINDOW_DAYS=${BUILDING_HUB_SYNC_UPLOAD_WINDOW_DAYS:-7}
      - BUILDING_HUB_SYNC_WINDOW_INTERVAL_SECONDS=${BUILDING_HUB_SYNC_WINDOW_INTERVAL_SECONDS:-86400}
      - BUILDING_HUB_SYNC_LATE_INTERVAL_SECONDS=${BUILDING_HUB_SYNC_LATE_INTERVAL_SECONDS:-86400}
      - LAND_INFO_SYNC_BASE_DIR=/data/source/land_info/auto
      - LAND_INFO_WORKER_DIR=/worker/land-info-worker
      - DATASET_PAYLOAD_VALUES_COMPRESS_LAND_INFO=0
      - LAND_INFO_STORE_SOURCE_METADATA=0
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY:-}
      - APP_ENV=${APP_ENV:-production}
      - MOBILE_OAUTH_CALLBACK_BASE_URL=${MOBILE_OAUTH_CALLBACK_BASE_URL:-https://building-land.com}
      - MOBILE_OAUTH_REDIRECT_ALLOWLIST=${MOBILE_OAUTH_REDIRECT_ALLOWLIST:-buildingland://oauth/callback}
      - KAKAO_OAUTH_CLIENT_ID=${KAKAO_OAUTH_CLIENT_ID:-}
      - KAKAO_OAUTH_CLIENT_SECRET=${KAKAO_OAUTH_CLIENT_SECRET:-}
      - NAVER_OAUTH_CLIENT_ID=${NAVER_OAUTH_CLIENT_ID:-}
      - NAVER_OAUTH_CLIENT_SECRET=${NAVER_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - STORE_VERIFIER_MODE=${STORE_VERIFIER_MODE:-production}
      - APPLE_BUNDLE_ID=${APPLE_BUNDLE_ID:-}
      - APPLE_SHARED_SECRET=${APPLE_SHARED_SECRET:-}
      - APPLE_ROOT_CA_FILE=/run/secrets/apple-root-ca.pem
      - GOOGLE_PLAY_PACKAGE_NAME=${GOOGLE_PLAY_PACKAGE_NAME:-}
      - GOOGLE_PLAY_SERVICE_ACCOUNT_FILE=/run/secrets/google-play-service-account.json
      - PLATFORM_INTERNAL_SERVICE_TOKEN=${PLATFORM_INTERNAL_SERVICE_TOKEN:-}
      - REPORT_ASSET_DIR=/data/report-assets
      - ENVIRONMENT_DATA_DIR=/data/environment
    volumes:
      - ./data/uploads:/data/uploads
      - ./scripts:/scripts:ro
      - ./연속지적:/data/uploads/연속지적:ro
      - ./data/source/building_info_hub:/data/source/building_info_hub:ro
      - ./건축물정보:/data/source/building_info:ro
      - ./건물통합정보:/data/source/building_integrated_info:ro
      - ./토지정보:/data/source/land_info:ro
      - ${LAND_INFO_WORKER_HOST_DIR:-/Volumes/land-info-worker}:/worker/land-info-worker:ro
      - ${REPORT_ASSET_HOST_DIR:-./data/report-assets}:/data/report-assets
      - ${ENVIRONMENT_DATA_HOST_DIR:-./web/data}:/data/environment:ro
      - ${APPLE_ROOT_CA_HOST_FILE:-/dev/null}:/run/secrets/apple-root-ca.pem:ro
      - ${GOOGLE_PLAY_SERVICE_ACCOUNT_HOST_FILE:-/dev/null}:/run/secrets/google-play-service-account.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  web:
    build: ./web
    container_name: web
    env_file: .env
    environment:
      - REAL_ESTATE_REPORT_HOST=0.0.0.0
      - REAL_ESTATE_REPORT_PORT=5180
      - APP_URL=https://building-land.com
      # 같은 호스트의 api 컨테이너로 직접 프록시 (외부 왕복 방지)
      - APP_SERVER_BASE_URL=http://api:8000
      - AUTH_DB_PATH=/data/web/auth.sqlite3
      - PLATFORM_API_BASE_URL=http://api:8000
      - PLATFORM_INTERNAL_SERVICE_TOKEN=${PLATFORM_INTERNAL_SERVICE_TOKEN:-}
    volumes:
      - ./data/web:/data/web
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  building-hub-sync:
    build: ./api
    container_name: building-hub-sync
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - BUILDING_LAND_API_BASE=http://api:8000
      - BUILDING_HUB_SYNC_DIR=/data/source/building_info_hub
      - BUILDING_HUB_API_SOURCE_PATH=/data/source/building_info_hub/staging/full
      - BUILDING_HUB_MIN_FREE_GB=${BUILDING_HUB_MIN_FREE_GB:-120}
      - BUILDING_HUB_SYNC_UPLOAD_DAY=${BUILDING_HUB_SYNC_UPLOAD_DAY:-20}
      - BUILDING_HUB_SYNC_UPLOAD_CHECK_HOUR=${BUILDING_HUB_SYNC_UPLOAD_CHECK_HOUR:-13}
      - BUILDING_HUB_SYNC_UPLOAD_WINDOW_DAYS=${BUILDING_HUB_SYNC_UPLOAD_WINDOW_DAYS:-7}
      - BUILDING_HUB_SYNC_WINDOW_INTERVAL_SECONDS=${BUILDING_HUB_SYNC_WINDOW_INTERVAL_SECONDS:-86400}
      - BUILDING_HUB_SYNC_LATE_INTERVAL_SECONDS=${BUILDING_HUB_SYNC_LATE_INTERVAL_SECONDS:-86400}
      - BUILDING_HUB_SYNC_INITIAL_DELAY_SECONDS=${BUILDING_HUB_SYNC_INITIAL_DELAY_SECONDS:-0}
      - BUILDING_HUB_SYNC_POLL_INTERVAL_SECONDS=${BUILDING_HUB_SYNC_POLL_INTERVAL_SECONDS:-30}
      - BUILDING_HUB_SYNC_IMPORT_TIMEOUT_SECONDS=${BUILDING_HUB_SYNC_IMPORT_TIMEOUT_SECONDS:-14400}
      - BUILDING_HUB_SYNC_RETRY_SECONDS=${BUILDING_HUB_SYNC_RETRY_SECONDS:-3600}
    volumes:
      - ./scripts:/scripts:ro
      - ./data/source/building_info_hub:/data/source/building_info_hub
      - ./건축물정보:/data/source/building_info
    depends_on:
      - api
      - postgres
    restart: unless-stopped
    command:
      - sh
      - -lc
      - |
        set -eu
        python /scripts/run_building_hub_scheduler.py \
          --repo-root / \
          --base-dir "$${BUILDING_HUB_SYNC_DIR:-/data/source/building_info_hub}" \
          --visible-source-dir /data/source/building_info \
          --api-base "$${BUILDING_LAND_API_BASE:-http://api:8000}" \
          --env-file /dev/null \
          --upload-day "$${BUILDING_HUB_SYNC_UPLOAD_DAY:-20}" \
          --upload-check-hour "$${BUILDING_HUB_SYNC_UPLOAD_CHECK_HOUR:-13}" \
          --upload-window-days "$${BUILDING_HUB_SYNC_UPLOAD_WINDOW_DAYS:-7}" \
          --window-check-interval "$${BUILDING_HUB_SYNC_WINDOW_INTERVAL_SECONDS:-21600}" \
          --late-check-interval "$${BUILDING_HUB_SYNC_LATE_INTERVAL_SECONDS:-86400}" \
          --retry-interval "$${BUILDING_HUB_SYNC_RETRY_SECONDS:-3600}" \
          --initial-delay "$${BUILDING_HUB_SYNC_INITIAL_DELAY_SECONDS:-0}" \
          --poll-interval "$${BUILDING_HUB_SYNC_POLL_INTERVAL_SECONDS:-30}" \
          --import-timeout "$${BUILDING_HUB_SYNC_IMPORT_TIMEOUT_SECONDS:-14400}"

  cadastral-sync:
    build: ./api
    container_name: cadastral-sync
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - BUILDING_LAND_API_BASE=http://api:8000
      - CADASTRAL_SYNC_BASE_DIR=/data/uploads/연속지적/auto
      - CADASTRAL_SYNC_CHECK_INTERVAL_SECONDS=${CADASTRAL_SYNC_CHECK_INTERVAL_SECONDS:-86400}
      - CADASTRAL_SYNC_RETRY_SECONDS=${CADASTRAL_SYNC_RETRY_SECONDS:-3600}
      - CADASTRAL_SYNC_INITIAL_DELAY_SECONDS=${CADASTRAL_SYNC_INITIAL_DELAY_SECONDS:-0}
      - CADASTRAL_SYNC_POLL_INTERVAL_SECONDS=${CADASTRAL_SYNC_POLL_INTERVAL_SECONDS:-30}
      - CADASTRAL_SYNC_IMPORT_TIMEOUT_SECONDS=${CADASTRAL_SYNC_IMPORT_TIMEOUT_SECONDS:-14400}
      - CADASTRAL_SYNC_MAX_DIRECT_DOWNLOAD_MB=${CADASTRAL_SYNC_MAX_DIRECT_DOWNLOAD_MB:-500}
      - CADASTRAL_SYNC_CLEANUP_ON_SUCCESS=${CADASTRAL_SYNC_CLEANUP_ON_SUCCESS:-1}
      - CADASTRAL_SYNC_MAX_FILES=${CADASTRAL_SYNC_MAX_FILES:-0}
      - VWORLD_USER_ID=${VWORLD_USER_ID:-}
      - VWORLD_USER_PASSWORD=${VWORLD_USER_PASSWORD:-}
    volumes:
      - ./scripts:/scripts:ro
      - ./연속지적:/data/uploads/연속지적
    depends_on:
      - api
      - postgres
    restart: unless-stopped
    command:
      - sh
      - -lc
      - |
        set -eu
        python /scripts/run_cadastral_update_scheduler.py \
          --repo-root / \
          --base-dir "$${CADASTRAL_SYNC_BASE_DIR:-/data/uploads/연속지적/auto}" \
          --api-base "$${BUILDING_LAND_API_BASE:-http://api:8000}" \
          --env-file /dev/null \
          --check-interval "$${CADASTRAL_SYNC_CHECK_INTERVAL_SECONDS:-86400}" \
          --retry-interval "$${CADASTRAL_SYNC_RETRY_SECONDS:-3600}" \
          --initial-delay "$${CADASTRAL_SYNC_INITIAL_DELAY_SECONDS:-0}" \
          --poll-interval "$${CADASTRAL_SYNC_POLL_INTERVAL_SECONDS:-30}" \
          --import-timeout "$${CADASTRAL_SYNC_IMPORT_TIMEOUT_SECONDS:-14400}" \
          --max-files "$${CADASTRAL_SYNC_MAX_FILES:-0}"

  building-integrated-sync:
    build: ./api
    container_name: building-integrated-sync
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - BUILDING_LAND_API_BASE=http://api:8000
      - BUILDING_INTEGRATED_SYNC_BASE_DIR=/data/source/building_integrated_info/auto
      - BUILDING_INTEGRATED_SYNC_CHECK_INTERVAL_SECONDS=${BUILDING_INTEGRATED_SYNC_CHECK_INTERVAL_SECONDS:-86400}
      - BUILDING_INTEGRATED_SYNC_RETRY_SECONDS=${BUILDING_INTEGRATED_SYNC_RETRY_SECONDS:-3600}
      - BUILDING_INTEGRATED_SYNC_INITIAL_DELAY_SECONDS=${BUILDING_INTEGRATED_SYNC_INITIAL_DELAY_SECONDS:-0}
      - BUILDING_INTEGRATED_SYNC_POLL_INTERVAL_SECONDS=${BUILDING_INTEGRATED_SYNC_POLL_INTERVAL_SECONDS:-30}
      - BUILDING_INTEGRATED_SYNC_IMPORT_TIMEOUT_SECONDS=${BUILDING_INTEGRATED_SYNC_IMPORT_TIMEOUT_SECONDS:-14400}
      - BUILDING_INTEGRATED_SYNC_MAX_DIRECT_DOWNLOAD_MB=${BUILDING_INTEGRATED_SYNC_MAX_DIRECT_DOWNLOAD_MB:-500}
      - BUILDING_INTEGRATED_SYNC_CLEANUP_ON_SUCCESS=${BUILDING_INTEGRATED_SYNC_CLEANUP_ON_SUCCESS:-1}
      - BUILDING_INTEGRATED_SYNC_MAX_FILES=${BUILDING_INTEGRATED_SYNC_MAX_FILES:-0}
      - VWORLD_USER_ID=${VWORLD_USER_ID:-}
      - VWORLD_USER_PASSWORD=${VWORLD_USER_PASSWORD:-}
    volumes:
      - ./scripts:/scripts:ro
      - ./건물통합정보:/data/source/building_integrated_info
    depends_on:
      - api
      - postgres
    restart: unless-stopped
    command:
      - sh
      - -lc
      - |
        set -eu
        python /scripts/run_building_integrated_update_scheduler.py \
          --repo-root / \
          --base-dir "$${BUILDING_INTEGRATED_SYNC_BASE_DIR:-/data/source/building_integrated_info/auto}" \
          --api-base "$${BUILDING_LAND_API_BASE:-http://api:8000}" \
          --env-file /dev/null \
          --check-interval "$${BUILDING_INTEGRATED_SYNC_CHECK_INTERVAL_SECONDS:-86400}" \
          --retry-interval "$${BUILDING_INTEGRATED_SYNC_RETRY_SECONDS:-3600}" \
          --initial-delay "$${BUILDING_INTEGRATED_SYNC_INITIAL_DELAY_SECONDS:-0}" \
          --poll-interval "$${BUILDING_INTEGRATED_SYNC_POLL_INTERVAL_SECONDS:-30}" \
          --import-timeout "$${BUILDING_INTEGRATED_SYNC_IMPORT_TIMEOUT_SECONDS:-14400}" \
          --max-files "$${BUILDING_INTEGRATED_SYNC_MAX_FILES:-0}"

  land-movement-sync:
    build: ./api
    container_name: land-movement-sync
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - BUILDING_LAND_API_BASE=http://api:8000
      - LAND_MOVEMENT_SYNC_BASE_DIR=/data/source/land_info/auto/land_movement
      - LAND_MOVEMENT_SYNC_CHECK_INTERVAL_SECONDS=${LAND_MOVEMENT_SYNC_CHECK_INTERVAL_SECONDS:-86400}
      - LAND_MOVEMENT_SYNC_RETRY_SECONDS=${LAND_MOVEMENT_SYNC_RETRY_SECONDS:-3600}
      - LAND_MOVEMENT_SYNC_INITIAL_DELAY_SECONDS=${LAND_MOVEMENT_SYNC_INITIAL_DELAY_SECONDS:-0}
      - LAND_MOVEMENT_SYNC_POLL_INTERVAL_SECONDS=${LAND_MOVEMENT_SYNC_POLL_INTERVAL_SECONDS:-30}
      - LAND_MOVEMENT_SYNC_IMPORT_TIMEOUT_SECONDS=${LAND_MOVEMENT_SYNC_IMPORT_TIMEOUT_SECONDS:-14400}
      - LAND_MOVEMENT_SYNC_MAX_DIRECT_DOWNLOAD_MB=${LAND_MOVEMENT_SYNC_MAX_DIRECT_DOWNLOAD_MB:-500}
      - LAND_MOVEMENT_SYNC_CLEANUP_ON_SUCCESS=${LAND_MOVEMENT_SYNC_CLEANUP_ON_SUCCESS:-1}
      - LAND_MOVEMENT_SYNC_MAX_FILES=${LAND_MOVEMENT_SYNC_MAX_FILES:-0}
      - LAND_MOVEMENT_SYNC_IMPORT_BATCH_SIZE=${LAND_MOVEMENT_SYNC_IMPORT_BATCH_SIZE:-2000}
      - VWORLD_USER_ID=${VWORLD_USER_ID:-}
      - VWORLD_USER_PASSWORD=${VWORLD_USER_PASSWORD:-}
    volumes:
      - ./scripts:/scripts:ro
      - ./토지정보:/data/source/land_info
    depends_on:
      - api
      - postgres
    restart: unless-stopped
    command:
      - sh
      - -lc
      - |
        set -eu
        python /scripts/run_land_movement_update_scheduler.py \
          --repo-root / \
          --base-dir "$${LAND_MOVEMENT_SYNC_BASE_DIR:-/data/source/land_info/auto/land_movement}" \
          --api-base "$${BUILDING_LAND_API_BASE:-http://api:8000}" \
          --env-file /dev/null \
          --check-interval "$${LAND_MOVEMENT_SYNC_CHECK_INTERVAL_SECONDS:-86400}" \
          --retry-interval "$${LAND_MOVEMENT_SYNC_RETRY_SECONDS:-3600}" \
          --initial-delay "$${LAND_MOVEMENT_SYNC_INITIAL_DELAY_SECONDS:-0}" \
          --poll-interval "$${LAND_MOVEMENT_SYNC_POLL_INTERVAL_SECONDS:-30}" \
          --import-timeout "$${LAND_MOVEMENT_SYNC_IMPORT_TIMEOUT_SECONDS:-14400}" \
          --max-files "$${LAND_MOVEMENT_SYNC_MAX_FILES:-0}" \
          --batch-size "$${LAND_MOVEMENT_SYNC_IMPORT_BATCH_SIZE:-2000}"

  postgres:
    image: postgres:16
    container_name: postgres
    env_file: .env
    # Large imports generate lots of WAL; increase WAL window to avoid excessive checkpoints.
    command:
      - postgres
      - -c
      - max_wal_size=8GB
      - -c
      - min_wal_size=2GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
    volumes:
      # Bind-mounting Postgres data on macOS can cause intermittent Permission denied / PANIC under heavy IO.
      # Use a named volume for reliability/performance.
      - pgdata:/var/lib/postgresql/data
      # Auto-apply schema/migrations on first init of the volume.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    image: postgres:16
    env_file: .env
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./db:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -lc
      - |
        set -eu
        for migration in /migrations/[0-9][0-9][0-9]_*.sql; do
          psql -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -v ON_ERROR_STOP=1 -f "$${migration}"
        done
    restart: "no"

  redis:
    image: redis:7
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    restart: unless-stopped

volumes:
  pgdata:
