http:
  routers:
    platform-api:
      rule: >-
        (Host(`building-land.com`) || Host(`www.building-land.com`)) &&
        (PathPrefix(`/api/mobile/v1`) || Path(`/api/v1/environment-analysis`) ||
        (PathPrefix(`/api/report-archive`) && HeaderRegexp(`Authorization`, `(?i)^Bearer\\s+.+`)))
      service: api
      priority: 200
      entryPoints:
        - web
    homepage:
      rule: Host(`building-land.com`) || Host(`www.building-land.com`)
      service: homepage
      entryPoints:
        - web
    api:
      rule: PathPrefix(`/`)
      service: api
      entryPoints:
        - web
    traefik-dashboard:
      rule: PathPrefix(`/traefik`)
      service: api@internal
      entryPoints:
        - web

  services:
    api:
      loadBalancer:
        servers:
          - url: "http://api:8000"
    homepage:
      loadBalancer:
        servers:
          - url: "http://web:5180"
